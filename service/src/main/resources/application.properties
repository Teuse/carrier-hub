spring.application.name=service

# ======================================================
# JPA / Hibernate (global defaults)
# ======================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# ======================================================
# Security
# ======================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_HOSTNAME}/realms/Carrier-Hub
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_HTTP_HOST:keycloak}:${KC_HTTP_PORT}/realms/Carrier-Hub/protocol/openid-connect/certs
carrier-hub.security.client-id=${KC_BACKEND_CLIENT_ID}

# ======================================================
# Flyway
# ======================================================
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public

# ======================================================
# Server
# ======================================================
server.port=8080

# ======================================================
# Logging (global)
# ======================================================
logging.level.org.springframework=INFO