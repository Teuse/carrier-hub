services:
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE_URL=$VITE_API_BASE_URL
        - VITE_KC_FRONTEND_CLIENT_ID=$VITE_KC_FRONTEND_CLIENT_ID
        - VITE_KC_HTTP_PORT=$VITE_KC_HTTP_PORT
        - VITE_KC_BACKEND_CLIENT_ID=$VITE_KC_BACKEND_CLIENT_ID
        - VITE_REDIRECT_URI=$VITE_REDIRECT_URI
    container_name: frontend
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "5173:5173"

  backend:
    build: ./service
    container_name: service
    depends_on:
      - postgres
      - keycloak
    env_file:
      - .env
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    container_name: database
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - carrier-hub-data:/var/lib/pg-ddb/data

  keycloak:
    build: ./keycloak
    container_name: keycloak
    command: start-dev --import-realm
    env_file:
      - .env
    ports:
      - "8090:8090"
    #volumes:
    #  - carrier-hub-keycloak-user:/opt/keycloak/data/

volumes:
  carrier-hub-data:
  #carrier-hub-keycloak-user: